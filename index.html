<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오늘 뭐 먹지? | 큐티 런치 크루</title>
    
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=566c59003be0a7db1292fbbc43b0fad0&libraries=services&autoload=false"></script>
    
    <style>
        :root {
            --bg-sweet: #f9f8f6;
            --card-white: #ffffff;
            --text-main: #4a4a4a;
            --text-muted: #a0a0a0;
            --primary-pink: #ff8b94;
            --secondary-mint: #a8e6cf;
            --creamy-yellow: #ffd3b6;
            --sky-blue: #dcedc1;
            --cookie-brown: #8b5a2b;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { background-color: var(--bg-sweet); color: var(--text-main); padding-bottom: 40px; }
        
        .container { max-width: 500px; margin: 0 auto; padding: 20px 16px; }

        /* 아기자기한 상단 헤더 */
        .cute-header { text-align: center; margin-bottom: 24px; padding: 10px 0; }
        .cute-title { font-size: 26px; font-weight: 900; color: #ff6b81; letter-spacing: -0.5px; display: inline-block; position: relative; }
        .cute-title::after { content: ''; display: block; width: 100%; height: 8px; background: var(--creamy-yellow); position: absolute; bottom: 2px; left: 0; z-index: -1; border-radius: 4px; }
        .cute-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-weight: bold; }

        /* 동글동글 폭신한 카드 */
        .cute-card { background: var(--card-white); border: 3px solid #f0ede9; border-radius: 24px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 0px #ebdcd0; }
        .card-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .section-title { font-size: 16px; font-weight: 800; color: #ff6b81; display: flex; align-items: center; gap: 6px; }

        .btn-reauth { background: #f5f0eb; border: none; color: var(--text-main); padding: 6px 12px; border-radius: 14px; font-size: 11px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 0 #d9cfc7; }
        .btn-reauth:active { transform: translateY(2px); box-shadow: none; }

        .btn-gps { width: 100%; background: #e3faf2; color: #20c997; border: 2px dashed #96e9c6; padding: 13px; border-radius: 18px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-gps:disabled { border: 2px solid #20c997; color: white; background: #20c997; cursor: not-allowed; }

        /* 말랑말랑한 슬라이더 */
        .range-container { margin-top: 14px; width: 100%; }
        .range-slider { width: 100%; height: 10px; -webkit-appearance: none; background: #eeded1; border-radius: 5px; outline: none; }
        .range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #ff6b81; cursor: pointer; border: 3px solid white; box-shadow: 0 3px 0px #e05266; }
        .range-ticks { display: flex; justify-content: space-between; margin-top: 8px; padding: 0 10px; }
        .tick-label { font-size: 11px; color: var(--text-muted); font-weight: bold; }
        .tick-item.active .tick-label { color: #ff6b81; font-weight: 900; }

        .privacy-notice { font-size: 12px; color: #7f8c8d; line-height: 1.5; margin-top: 14px; text-align: center; background: #fdfaf7; padding: 10px; border-radius: 14px; border: 1px dashed #e6dbd0; }
        .privacy-notice .addr-highlight { color: #3498db; font-weight: 800; }

        /* 레시피 재료 믹스 (필터 슬롯) */
        .slot-group-title { font-size: 12px; color: #95a5a6; margin: 14px 0 6px 0; font-weight: bold; }
        .checkbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .checkbox-item input { position: absolute; opacity: 0; width: 0; height: 0; }
        .checkbox-label { display: block; text-align: center; background: #faf9f7; border: 2px solid #eeded1; padding: 11px 4px; border-radius: 16px; font-size: 13px; font-weight: bold; color: var(--text-main); cursor: pointer; transition: all 0.15s; box-shadow: 0 3px 0 #eeded1; }
        .checkbox-item input:checked + .checkbox-label { background: #fff0f2; color: #ff6b81; border-color: #ff6b81; box-shadow: 0 3px 0 #ff6b81; transform: translateY(-1px); }
        .checkbox-item input:disabled + .checkbox-label { background: #f1ede9; color: #c8bfb7; border-color: #e5ded8; box-shadow: none; cursor: not-allowed; }

        /* 런치 뽑기 모드 스위치 */
        .random-container { background: #fffdf9; border: 2px solid #ffd3b6; border-radius: 18px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 0 #ffe3d1; }
        .random-info-box { display: flex; flex-direction: column; }
        .random-toggle-btn { background: #f5f0eb; border: none; color: var(--text-main); padding: 10px 16px; border-radius: 14px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 3px 0 #d9cfc7; }
        .random-toggle-btn.active { background: #ff6b81; color: white; box-shadow: 0 3px 0 #e05266; }
        .dagger-counter { font-size: 12px; color: #e67e22; font-weight: bold; margin-top: 3px; display: flex; align-items: center; gap: 3px; }

        /* 맛있게 섞는 중 로딩 연출 */
        .casting-box { display: none; text-align: center; padding: 20px 0; }
        .casting-text { font-size: 14px; font-weight: bold; color: #ff6b81; margin-bottom: 10px; animation: bounce 0.6s infinite alternate; }
        .casting-bar-bg { width: 100%; height: 12px; background: #eeded1; border-radius: 6px; overflow: hidden; pading: 2px; }
        .casting-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffd3b6, #ff8b94); border-radius: 6px; transition: width 1.2s linear; }

        /* 탐색 시작 버튼 */
        .btn-submit { width: 100%; background: linear-gradient(135deg, #ff6b81, #ff8b94); color: white; border: none; padding: 16px; border-radius: 20px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0px #e05266; letter-spacing: -0.5px; }
        .btn-submit:active { transform: translateY(4px); box-shadow: 0 2px 0px #e05266; }

        /* 결과 리스트 쿠키 스타일 */
        .result-section { margin-top: 24px; display: none; }
        .result-title { font-size: 16px; font-weight: 900; margin-bottom: 12px; color: #ff6b81; display: flex; align-items: center; gap: 4px; }
        .restaurant-list { display: flex; flex-direction: column; gap: 14px; }
        .restaurant-card { background: var(--card-white); border: 3px solid #f0ede9; border-radius: 20px; padding: 14px; display: flex; gap: 12px; position: relative; box-shadow: 0 6px 0 #ebdcd0; }
        .restaurant-card::before { content: 'TODAY'; position: absolute; top: 0; left: 0; background: #ffd3b6; color: #d35400; font-size: 10px; font-weight: 900; padding: 3px 8px 4px 8px; border-bottom-right-radius: 12px; }
        
        .restaurant-thumb { width: 66px; height: 66px; border-radius: 16px; background: #fffdfa; border: 2px solid #eeded1; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
        .restaurant-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; padding-top: 6px; }
        .restaurant-name { font-size: 16px; font-weight: 900; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .restaurant-category { font-size: 12px; color: var(--text-muted); font-weight: bold; margin-top: 1px; }
        .restaurant-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
        .distance { font-size: 12px; color: #ff6b81; font-weight: 900; }
        .btn-map-trigger { background: #fff0f2; border: 1px solid #ffccd3; color: #ff6b81; padding: 6px 14px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; }

        /* 포탈 모달 팝업 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(2px); }
        .modal { background: var(--card-white); border: 3px solid #f0ede9; width: 100%; max-width: 340px; border-radius: 24px; padding: 22px; text-align: center; box-shadow: 0 8px 0px rgba(0,0,0,0.1); }
        .modal-title { font-size: 16px; font-weight: 900; margin-bottom: 20px; color: var(--text-main); }
        .map-options { display: flex; flex-direction: column; gap: 10px; }
        .map-btn { width: 100%; padding: 14px; border: none; border-radius: 16px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .map-btn.kakao { background-color: #fee500; color: #3c1e1e; box-shadow: 0 4px 0 #ebd100; }
        .map-btn.naver { background-color: #03c75a; color: white; box-shadow: 0 4px 0 #02a64a; }
        .modal-close { background: none; border: none; color: var(--text-muted); margin-top: 16px; cursor: pointer; text-decoration: underline; font-size: 12px; font-weight: bold; }

        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-4px); } }
    </style>
</head>
<body>

<div class="container">
    <div class="cute-header">
        <div class="cute-title">🍳 런치 크루 믹스!</div>
        <div class="cute-subtitle">매일 고통받는 점심 일상에 상큼한 구원 투수!</div>
    </div>

    <div id="sdkErrorBox" style="display:none; background:#ffe3e3; border:2px solid #ffb3b3; padding:15px; border-radius:16px; margin-bottom:15px; font-size:12px; color:#c92a2a; font-weight:bold; text-align:center;">
        ⚠️ 카카오 지도 인증에 실패했어요. 도메인 설정 주소를 다시 체크해주세요!
    </div>

    <div class="cute-card">
        <div class="card-header-flex">
            <div class="section-title">📍 레이더 범위 정하기</div>
            <button class="btn-reauth" onclick="triggerReauth()">🔄 위치 재동기화</button>
        </div>
        
        <div class="gps-block">
            <button class="btn-gps" id="gpsBtn" onclick="getGPSLocation()">슝슝 위성 안테나 가동 중...</button>
        </div>
        
        <div class="range-container">
            <input type="range" class="range-slider" id="radiusRange" min="0" max="1000" step="200" value="400" oninput="changeRadiusValue(this.value)">
            <div class="range-ticks">
                <div class="tick-item" id="tick-0"><span class="tick-label">0m</span></div>
                <div class="tick-item" id="tick-200"><span class="tick-label">200m</span></div>
                <div class="tick-item active" id="tick-400"><span class="tick-label">400m</span></div>
                <div class="tick-item" id="tick-600"><span class="tick-label">600m</span></div>
                <div class="tick-item" id="tick-800"><span class="tick-label">800m</span></div>
                <div class="tick-item" id="tick-1000"><span class="tick-label">1km</span></div>
            </div>
        </div>
        <div class="privacy-notice" id="privacyNoticeBox">💡 위치 정보는 수집하지 않아요.</div>
    </div>

    <div class="cute-card">
        <div class="card-header-flex" style="margin-bottom: 8px;">
            <div class="section-title">🎨 비밀 레시피 조합하기</div>
        </div>

        <div class="random-container">
            <div class="random-info-box">
                <span style="font-size:14px; font-weight: 900; color:#d35400;">🎰 런치 캡슐 뽑기 (랜덤 디펜스)</span>
                <span class="dagger-counter" id="daggerCounter">❤️ 하트 토큰 기회: 3 / 3</span>
            </div>
            <button class="random-toggle-btn" id="randomToggleBtn" onclick="toggleRandomMode()">OFF</button>
        </div>

        <div id="filterMatrixGroup">
            <div class="slot-group-title">🥦 무슨 원소를 넣어볼까요? (음식 종류)</div>
            <div class="checkbox-grid">
                <div class="checkbox-item"><input type="checkbox" class="menu-filter-cb" id="t1" value="한식"><label for="t1" class="checkbox-label">한식</label></div>
                <div class="checkbox-item"><input type="checkbox" class="menu-filter-cb" id="t2" value="중식"><label for="t2" class="checkbox-label">중식</label></div>
                <div class="checkbox-item"><input type="checkbox" class="menu-filter-cb" id="t3" value="일식"><label for="t3" class="checkbox-label">일식</label></div>
                <div class="checkbox-item"><input type="checkbox" class="menu-filter-cb" id="t4" value="양식"><label for="t4" class="checkbox-label">양식</label></div>
                <div class="checkbox-item"><input type="checkbox" class="menu-filter-cb" id="t5" value="고기"><label for="t5" class="checkbox-label">고기구이</label></div>
                <div class="checkbox-item"><input type="checkbox" class="menu-filter-cb" id="t6" value="회"><label for="t6" class="checkbox-label">회/수산</label></div>
            </div>

            <div class="slot-group-title">🔥 냠냠 스파이스 (맛 취향 필터)</div>
            <div class="checkbox-grid">
                <div class="checkbox-item"><input type="checkbox" class="menu-filter-cb" id="m1" value="매운"><label for="m1" class="checkbox-label">🌶️ 매콤함</label></div>
                <div class="checkbox-item"><input type="checkbox" class="menu-filter-cb" id="m2" value="국물"><label for="m2" class="checkbox-label">🍲 국물요리</label></div>
                <div class="checkbox-item"><input type="checkbox" class="menu-filter-cb" id="m3" value="달콤"><label for="m3" class="checkbox-label">🥞 달달함</label></div>
            </div>
        </div>
    </div>

    <div class="casting-box" id="castingBox">
        <div class="casting-text" id="castingText">레시피를 맛있게 믹스하는 중... 냠냠!</div>
        <div class="casting-bar-bg"><div class="casting-bar-fill" id="castingBarFill"></div></div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="startRaidCasting()">오늘의 맛집 서칭 개시! ✨</button>

    <div class="result-section" id="resultSection">
        <div class="result-title">🎉 오늘의 런치 크루 후보 완성!</div>
        <div class="restaurant-list" id="restaurantContainer"></div>
    </div>
</div>

<div class="modal-overlay" id="mapModal">
    <div class="modal">
        <div class="modal-title" id="modalTargetName">식당 이름</div>
        <div class="map-options">
            <button class="map-btn kakao" onclick="openMapApp('kakao')">💛 카카오맵 지도로 볼래요</button>
            <button class="map-btn naver" onclick="openMapApp('naver')">💚 네이버지도로 볼래요</button>
        </div>
        <button class="modal-close" onclick="closeMapModal()">닫을래요</button>
    </div>
</div>

<script>
    let userLat = null;
    let userLng = null;
    let selectedPlace = null;
    let ps = null;
    let geocoder = null;
    
    let isRandomMode = false;
    let rerollDaggers = 3; 

    const emojiMap = { "한식": "🍚", "중식": "🐼", "일식": "🍣", "양식": "🍝", "고기": "🥩", "회": "🐟", "치킨": "🍗", "면": "🍜", "탕": "🍲", "국밥": "🍲", "카페": "☕", "기타": "🍴" };

    window.onload = function() {
        if (typeof kakao !== 'undefined' && kakao.maps) {
            kakao.maps.load(() => {
                ps = new kakao.maps.services.Places();
                geocoder = new kakao.maps.services.Geocoder();
                getGPSLocation();
            });
        } else {
            document.getElementById('sdkErrorBox').style.display = "block";
        }
    }

    function getGPSLocation() {
        const gpsBtn = document.getElementById('gpsBtn');
        const noticeBox = document.getElementById('privacyNoticeBox');
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                position => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    
                    gpsBtn.innerText = "✓ 안테나 연결 완료!";
                    gpsBtn.disabled = true; 

                    convertCoordsToAddr(userLng, userLat);
                },
                error => { 
                    gpsBtn.innerText = "📡 내 위치 안테나 켜기 (인증)"; 
                    gpsBtn.disabled = false; 
                    noticeBox.innerHTML = "💡 위치 정보는 수집하지 않아요.";
                }
            );
        } else { 
            gpsBtn.innerText = "GPS 미지원 기기에요 🥲"; 
        }
    }

    function convertCoordsToAddr(lng, lat) {
        const noticeBox = document.getElementById('privacyNoticeBox');
        if (!geocoder) return;
        
        geocoder.coord2Address(lng, lat, (result, status) => {
            if (status === kakao.maps.services.Status.OK && result[0]) {
                const addr = result[0].address;
                const regionText = `${addr.region_1depth_name} ${addr.region_2depth_name} ${addr.region_3depth_name}`;
                noticeBox.innerHTML = `💡 현재 위치 : <span class="addr-highlight">${regionText}</span> (위치 정보는 수집하지 않아요.)`;
            }
        });
    }

    function triggerReauth() {
        const gpsBtn = document.getElementById('gpsBtn');
        document.getElementById('privacyNoticeBox').innerHTML = "💡 위치 정보는 수집하지 않아요.";
        userLat = null;
        userLng = null;
        
        gpsBtn.innerText = "안테나 리셋하는 중...";
        gpsBtn.disabled = true;
        
        setTimeout(getGPSLocation, 400);
    }

    function changeRadiusValue(val) { 
        document.querySelectorAll('.tick-item').forEach(item => item.classList.remove('active'));
        const targetTick = document.getElementById('tick-' + val);
        if (targetTick) targetTick.classList.add('active');
    }

    function toggleRandomMode() {
        const btn = document.getElementById('randomToggleBtn');
        isRandomMode = !isRandomMode;

        if (isRandomMode) {
            btn.innerText = "ON";
            btn.classList.add('active');
            document.querySelectorAll('.menu-filter-cb').forEach(cb => {
                cb.checked = false;
                cb.disabled = true;
            });
        } else {
            btn.innerText = "OFF";
            btn.classList.remove('active');
            document.querySelectorAll('.menu-filter-cb').forEach(cb => cb.disabled = false);
        }
    }

    function startRaidCasting() {
        if (!userLat || !userLng) { 
            alert("위치 좌표 연동이 필요해요!"); 
            return; 
        }

        const radius = parseInt(document.getElementById('radiusRange').value);
        if (radius === 0) {
            alert("검색 범위를 200m 이상으로 늘려주세요!");
            return;
        }

        if (isRandomMode) {
            if (rerollDaggers <= 0) {
                alert("💔 하트 토큰을 모두 다 썼어요! 내일 다시 도전해 주세요.");
                return;
            }
            rerollDaggers--;
            document.getElementById('daggerCounter').innerText = `❤️ 하트 토큰 기회: ${rerollDaggers} / 3`;
        }

        const submitBtn = document.getElementById('submitBtn');
        const castingBox = document.getElementById('castingBox');
        const castingBarFill = document.getElementById('castingBarFill');
        const castingText = document.getElementById('castingText');
        const resultSection = document.getElementById('resultSection');

        resultSection.style.display = "none";
        submitBtn.style.display = "none";
        castingBox.style.display = "block";
        castingBarFill.style.width = "0%";
        
        castingText.innerText = isRandomMode ? "🎰 랜덤 런치 박스를 오픈하는 중이에요!" : "🍳 선택하신 맛 원소들을 맛있게 섞는 중 이에요!";

        setTimeout(() => {
            castingBarFill.style.width = "100%";
        }, 50);

        setTimeout(() => {
            castingBox.style.display = "none";
            submitBtn.style.display = "block";
            fetchRealRestaurants();
        }, 1250);
    }

    function fetchRealRestaurants() {
        const radius = parseInt(document.getElementById('radiusRange').value);
        let keywords = [];

        if (!isRandomMode) {
            document.querySelectorAll('.menu-filter-cb:checked').forEach(cb => keywords.push(cb.value));
        }

        let query = keywords.length > 0 ? keywords.join(" ") : "음식점"; 

        const searchOptions = {
            location: new kakao.maps.LatLng(userLat, userLng),
            radius: radius,
            category_group_code: 'FD6', 
            sort: kakao.maps.services.SortBy.DISTANCE 
        };

        ps.keywordSearch(query, placesSearchCB, searchOptions);
    }

    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            if (isRandomMode && data.length > 0) {
                const randomBoss = data[Math.floor(Math.random() * data.length)];
                renderRealList([randomBoss]);
            } else {
                renderRealList(data);
            }
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            renderRealList([]); 
        } else {
            alert("카카오 서버가 응답을 주지 않아요 🥲");
        }
    }

    function renderRealList(places) {
        const container = document.getElementById('restaurantContainer');
        const section = document.getElementById('resultSection');
        container.innerHTML = "";

        if (!places || places.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">이 조건의 맛집 크루를 찾지 못했어요 🥲 다른 필터를 조합해봐요!</div>`;
        } else {
            places.forEach(place => {
                let emoji = "✨";
                for (let key in emojiMap) { 
                    if (place.category_name.includes(key) || place.place_name.includes(key)) emoji = emojiMap[key]; 
                }

                const card = document.createElement('div');
                card.className = "restaurant-card";
                card.innerHTML = `
                    <div class="restaurant-thumb">${emoji}</div>
                    <div class="restaurant-info">
                        <div>
                            <div class="restaurant-name">${place.place_name}</div>
                            <div class="restaurant-category">${place.category_name.split(' > ').pop() || "맛있는 식당"}</div>
                        </div>
                        <div class="restaurant-meta">
                            <span class="distance">📍 우리집에서 ${place.distance}m</span>
                            <button class="btn-map-trigger" onclick="selectPlaceForMap('${place.place_name}', '${place.x}', '${place.y}')">이동하기 🧭</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        section.style.display = "block";
        section.scrollIntoView({ behavior: 'smooth' });
    }

    function selectPlaceForMap(name, x, y) {
        selectedPlace = { name, x, y };
        document.getElementById('modalTargetName').innerText = name;
        document.getElementById('mapModal').style.display = "flex";
    }

    function closeMapModal() { document.getElementById('mapModal').style.display = "none"; }

    function openMapApp(provider) {
        if (!selectedPlace) return;
        const { name, x, y } = selectedPlace;
        let targetUrl = "";

        if (provider === 'kakao') {
            targetUrl = `https://map.kakao.com/link/to/${encodeURIComponent(name)},${y},${x}`;
        } else if (provider === 'naver') {
            targetUrl = `https://map.naver.com/v5/search/${encodeURIComponent(name)}`;
        }

        window.open(targetUrl, '_blank');
        closeMapModal();
    }
</script>
</body>
</html>
