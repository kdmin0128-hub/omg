<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오늘 뭐 먹지? | 런치 크루 멀티 덱</title>
    
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=566c59003be0a7db1292fbbc43b0fad0&libraries=services&autoload=false"></script>
    
    <style>
        :root {
            --bg-sweet: #fbf9f6;
            --card-white: #ffffff;
            --text-main: #3a3a3a;
            --text-muted: #b0a69f;
            --primary-pink: #ff7888;
            --soft-yellow: #ffebcc;
            --mint: #66dbb2;
            --shadow-color: #ebdcd0;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { background-color: var(--bg-sweet); color: var(--text-main); padding-bottom: 50px; overflow-x: hidden; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px 16px; }

        /* 상단 헤더 */
        .cute-header { text-align: center; margin-bottom: 24px; }
        .cute-title { font-size: 26px; font-weight: 900; color: #ff5266; display: inline-block; position: relative; letter-spacing: -0.5px; }
        .cute-title::after { content: ''; display: block; width: 100%; height: 10px; background: #ffe4b5; position: absolute; bottom: 0; left: 0; z-index: -1; border-radius: 5px; }
        .cute-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-weight: bold; }

        /* 카드 기본 구조 */
        .cute-card { background: var(--card-white); border: 3px solid #f2ece6; border-radius: 26px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 0px var(--shadow-color); position: relative; }
        .section-title { font-size: 16px; font-weight: 900; color: #ff5266; display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }

        /* 안테나 버튼 및 슬라이더 */
        .btn-gps { width: 100%; background: #e8fcf4; color: #1abc9c; border: 2px dashed #a3ecd4; padding: 14px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-gps:disabled { border: 3px solid #1abc9c; color: white; background: #1abc9c; cursor: not-allowed; box-shadow: 0 4px 0 #148f77; }
        
        .range-container { margin-top: 16px; width: 100%; }
        .range-slider { width: 100%; height: 10px; -webkit-appearance: none; background: #ebdcd0; border-radius: 5px; outline: none; }
        .range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #ff5266; cursor: pointer; border: 3px solid white; box-shadow: 0 3px 0px #cf3c4e; }
        .range-ticks { display: flex; justify-content: space-between; margin-top: 8px; padding: 0 5px; }
        .tick-label { font-size: 11px; color: var(--text-muted); font-weight: bold; }
        .tick-item.active .tick-label { color: #ff5266; font-weight: 900; }

        /* 랜덤 모드 */
        .random-container { background: #fffdf9; border: 2.5px solid #ffcc99; border-radius: 20px; padding: 14px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 0 #ffdcb8; }
        .random-toggle-btn { background: #f2ece6; border: none; color: var(--text-main); padding: 10px 18px; border-radius: 16px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 3px 0 #d5c8bd; }
        .random-toggle-btn.active { background: #ff5266; color: white; box-shadow: 0 3px 0 #cf3c4e; }

        /* 📍 요청하신 2분할 슬롯 디자인 믹스 레이아웃 */
        .deck-slots-flex { display: flex; gap: 12px; margin-top: 10px; }
        .slot-box { flex: 1; background: #faf8f5; border: 3px dashed #ebdcd0; border-radius: 22px; padding: 16px 10px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 105px; transition: all 0.2s; }
        .slot-box:active { transform: scale(0.98); }
        .slot-icon { font-size: 24px; margin-bottom: 4px; color: var(--text-muted); font-weight: bold; }
        .slot-label { font-size: 12px; font-weight: bold; color: var(--text-muted); }

        /* 슬롯 내부에 다중 선택된 카드 칩들이 정렬될 때의 디자인 */
        .slot-chips-inner { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%; }
        .equipped-chip { background: white; border: 2px solid #ff7888; color: #ff5266; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 12px; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 0 #ffbcc4; animation: pop 0.2s ease-out; }
        .chip-remove { font-size: 12px; cursor: pointer; color: #b0a69f; font-weight: bold; margin-left: 2px; }
        .chip-remove:hover { color: #ff5266; }

        /* 하단 바텀시트 팝업 슬라이더 */
        .bottom-sheet-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; z-index: 2000; backdrop-filter: blur(2px); }
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: white; border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 24px 16px; max-height: 80vh; overflow-y: auto; z-index: 2001; transition: bottom 0.3s ease-out; box-shadow: 0 -8px 20px rgba(0,0,0,0.05); }
        .bottom-sheet.show { bottom: 0; }
        .sheet-title { font-size: 16px; font-weight: 900; text-align: center; margin-bottom: 16px; }
        
        .card-selection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .select-item-card { background: #faf8f5; border: 2.5px solid #f0ede8; border-radius: 18px; padding: 12px 4px; text-align: center; cursor: pointer; box-shadow: 0 4px 0 #eeded1; position: relative; transition: all 0.1s; }
        .select-item-card.selected { background: #fff0f2; border-color: #ff5266; box-shadow: 0 4px 0 #ffbcc4; transform: translateY(-1px); }
        .select-item-card.selected::after { content: '✓'; position: absolute; top: 4px; right: 8px; color: #ff5266; font-weight: bold; font-size: 12px; }
        .select-item-emoji { font-size: 26px; margin-bottom: 4px; display: block; }
        .select-item-text { font-size: 12px; font-weight: bold; }

        /* 직접 입력 인풋 컴포넌트 */
        .custom-input-box { background: #fffdf9; border: 2px dashed #ffcc99; border-radius: 16px; padding: 10px; margin-bottom: 16px; display: none; align-items: center; gap: 8px; }
        .custom-input-box input { flex: 1; border: 2px solid #f2ece6; padding: 8px 12px; border-radius: 12px; font-size: 13px; font-weight: bold; outline: none; }
        .custom-input-box button { background: #ffcc99; border: none; color: #d35400; font-weight: bold; padding: 8px 14px; border-radius: 12px; cursor: pointer; font-size: 12px; }

        .btn-sheet-confirm { width: 100%; background: #ff5266; color: white; border: none; padding: 14px; border-radius: 16px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #cf3c4e; }

        /* 로딩 애니메이션 바 */
        .casting-box { display: none; text-align: center; padding: 20px 0; }
        .casting-text { font-size: 14px; font-weight: bold; color: #ff5266; margin-bottom: 10px; animation: bounce 0.5s infinite alternate; }
        .casting-bar-bg { width: 100%; height: 12px; background: #eeded1; border-radius: 6px; overflow: hidden; }
        .casting-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffebcc, #ff7888); border-radius: 6px; transition: width 1.2s linear; }

        /* 탐색 실행 메인 버튼 */
        .btn-submit { width: 100%; background: linear-gradient(135deg, #ff5266, #ff7888); color: white; border: none; padding: 16px; border-radius: 22px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0px #d6384b; letter-spacing: -0.3px; }
        .btn-submit:active { transform: translateY(4px); box-shadow: 0 2px 0px #d6384b; }

        /* 결과 명단 카드 진열대 */
        .result-section { margin-top: 24px; display: none; }
        .result-title { font-size: 16px; font-weight: 900; margin-bottom: 12px; color: #ff5266; }
        .restaurant-list { display: flex; flex-direction: column; gap: 14px; }
        
        .restaurant-card { background: var(--card-white); border: 3px solid #f2ece6; border-radius: 22px; padding: 14px; display: flex; gap: 12px; position: relative; box-shadow: 0 6px 0 var(--shadow-color); opacity: 0; transform: translateY(20px); animation: slideUp 0.4s forwards; }
        .restaurant-card::before { content: 'MATCH'; position: absolute; top: 0; left: 0; background: #ffebcc; color: #d35400; font-size: 9px; font-weight: 900; padding: 3px 8px; border-bottom-right-radius: 12px; }
        
        .restaurant-thumb { width: 66px; height: 66px; border-radius: 16px; background: #fffdfa; border: 2px solid #eeded1; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
        .restaurant-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; padding-top: 4px; }
        .restaurant-name { font-size: 16px; font-weight: 900; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .restaurant-category { font-size: 12px; color: var(--text-muted); font-weight: bold; }
        .restaurant-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
        .distance { font-size: 12px; color: #ff5266; font-weight: 900; }
        .btn-map-trigger { background: #fff0f2; border: 1px solid #ffccd3; color: #ff5266; padding: 6px 14px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; }

        /* 지도 연결 팝업 모달 */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 3000; backdrop-filter: blur(2px); }
        .modal { background: var(--card-white); border: 3px solid #f2ece6; width: 100%; max-width: 340px; border-radius: 24px; padding: 22px; text-align: center; }
        .modal-title { font-size: 16px; font-weight: 900; margin-bottom: 20px; }
        .map-options { display: flex; flex-direction: column; gap: 10px; }
        .map-btn { width: 100%; padding: 14px; border: none; border-radius: 16px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .map-btn.kakao { background: #fee500; color: #3c1e1e; box-shadow: 0 4px 0 #ebd100; }
        .map-btn.naver { background: #03c75a; color: white; box-shadow: 0 4px 0 #02a64a; }
        .modal-close { background: none; border: none; color: var(--text-muted); margin-top: 16px; cursor: pointer; text-decoration: underline; font-size: 12px; font-weight: bold; }

        /* 애니메이션 모션 효과 */
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }
        @keyframes pop { 0% { transform: scale(0.9); } 100% { transform: scale(1); } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="cute-header">
        <div class="cute-title">🍳 런치 멀티 크루 덱!</div>
        <div class="cute-subtitle">여러 카드를 마음껏 장착해 취향대로 믹스해요</div>
    </div>

    <div class="cute-card">
        <div class="section-title">📍 탐색 반경 정하기</div>
        <button class="btn-gps" id="gpsBtn" onclick="getGPSLocation()">📡 위성 안테나 신호 탐색 중...</button>
        <div class="range-container">
            <input type="range" class="range-slider" id="radiusRange" min="200" max="1000" step="200" value="400" oninput="changeRadiusValue(this.value)">
            <div class="range-ticks">
                <div class="tick-item" id="tick-200"><span class="tick-label">200m</span></div>
                <div class="tick-item active" id="tick-400"><span class="tick-label">400m</span></div>
                <div class="tick-item" id="tick-600"><span class="tick-label">600m</span></div>
                <div class="tick-item" id="tick-800"><span class="tick-label">800m</span></div>
                <div class="tick-item" id="tick-1000"><span class="tick-label">1km</span></div>
            </div>
        </div>
    </div>

    <div class="cute-card" id="deckContainerCard">
        <div class="section-title">🃏 내가 커스텀한 조합 덱</div>

        <div class="random-container">
            <div>
                <span style="font-size:14px; font-weight:900; color:#d35400;">🎰 런치 무작위 캡슐 뽑기</span>
                <div style="font-size:12px; color:#e67e22; font-weight:bold; margin-top:2px;" id="daggerCounter">❤️ 하트 토큰 기회: 3 / 3</div>
            </div>
            <button class="random-toggle-btn" id="randomToggleBtn" onclick="toggleRandomMode()">OFF</button>
        </div>

        <div class="deck-slots-flex" id="slotsWrapper">
            <div class="slot-box" id="slot-menu" onclick="openBottomSheet('menu')">
                <div class="slot-icon">＋</div>
                <div class="slot-label">어떤 종류?</div>
            </div>
            <div class="slot-box" id="slot-spice" onclick="openBottomSheet('spice')">
                <div class="slot-icon">＋</div>
                <div class="slot-label">어떤 맛 특성?</div>
            </div>
        </div>
    </div>

    <div class="casting-box" id="castingBox">
        <div class="casting-text" id="castingText">맛있는 크루 카드들을 한 그릇에 믹스 중... 냠냠!</div>
        <div class="casting-bar-bg"><div class="casting-bar-fill" id="castingBarFill"></div></div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="startCardCasting()">오늘의 맛집 서칭 개시! ✨</button>

    <div class="result-section" id="resultSection">
        <div class="result-title">🎉 짜잔! 매칭된 스페셜 런치 명단</div>
        <div class="restaurant-list" id="restaurantContainer"></div>
    </div>
</div>

<div class="bottom-sheet-overlay" id="sheetOverlay" onclick="closeBottomSheet()"></div>
<div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-title" id="sheetTitle">카드를 모두 골라주세요</div>
    
    <div class="custom-input-box" id="customInputWrapper">
        <input type="text" id="customCardInput" placeholder="원하는 메뉴/키워드 직접 입력...">
        <button onclick="addCustomKeywordCard()">장착</button>
    </div>

    <div class="card-selection-grid" id="sheetGrid"></div>
    <button class="btn-sheet-confirm" onclick="closeBottomSheet()">장착 완료하기 🎒</button>
</div>

<div class="modal-overlay" id="mapModal">
    <div class="modal">
        <div class="modal-title" id="modalTargetName">식당 이름</div>
        <div class="map-options">
            <button class="map-btn kakao" onclick="openMapApp('kakao')">💛 카카오맵 열기</button>
            <button class="map-btn naver" onclick="openMapApp('naver')">💚 네이버 지도 열기</button>
        </div>
        <button class="modal-close" onclick="closeMapModal()">닫을래요</button>
    </div>
</div>

<script>
    let userLat = null;
    let userLng = null;
    let selectedPlace = null;
    let ps = null;
    
    let isRandomMode = false;
    let rerollDaggers = 3;

    // 복수 선택 장착용 데이터 자료구조
    let selectedMenuCards = new Set();
    let selectedSpiceCards = new Set();
    let currentTargetSlotType = '';

    // 커스텀 직접 입력 데이터 풀
    let customMenuCards = [];
    let customSpiceCards = [];

    // 필터 기본 풀 매트릭스 데이터
    const cardData = {
        menu: [
            { text: "한식", emoji: "🍚" }, { text: "중식", emoji: "🐼" }, { text: "일식", emoji: "🍣" }, { text: "양식", emoji: "🍝" },
            { text: "면 종류", emoji: "🍜" }, { text: "밥 종류", emoji: "🌾" },
            { text: "치킨/피자", emoji: "🍗" }, { text: "버거/샌드위치", emoji: "🍔" }, { text: "분식", emoji: "🍛" }, { text: "샐러드/포케", emoji: "🥗" }, { text: "카페/디저트", emoji: "☕" }
        ],
        spice: [
            { text: "매운", emoji: "🌶️" }, { text: "담백한", emoji: "🥛" }, { text: "달콤한", emoji: "🥞" },
            { text: "시원한", emoji: "❄️" }, { text: "국물", emoji: "🍲" }, { text: "고기", emoji: "🥩" }, { text: "튀김", emoji: "🍤" }, { text: "빠른", emoji: "⏱️" }
        ]
    };

    window.onload = function() {
        if (typeof kakao !== 'undefined' && kakao.maps) {
            kakao.maps.load(() => {
                ps = new kakao.maps.services.Places();
                getGPSLocation();
            });
        }
    }

    function getGPSLocation() {
        const gpsBtn = document.getElementById('gpsBtn');
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                position => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    gpsBtn.innerText = "✓ 위성 안테나 연결 완료!";
                    gpsBtn.disabled = true; 
                },
                error => { gpsBtn.innerText = "📡 위성 안테나 다시 켜기"; }
            );
        }
    }

    /* 바텀 시트 열기 */
    function openBottomSheet(type) {
        if(isRandomMode) return;
        currentTargetSlotType = type;
        const sheet = document.getElementById('bottomSheet');
        const overlay = document.getElementById('sheetOverlay');
        const grid = document.getElementById('sheetGrid');
        const title = document.getElementById('sheetTitle');
        const inputWrapper = document.getElementById('customInputWrapper');

        title.innerText = type === 'menu' ? "🥦 음식 종류 카드를 모두 골라주세요" : "🔥 취향 스파이스를 모두 골라주세요";
        grid.innerHTML = "";
        inputWrapper.style.display = "flex";
        document.getElementById('customCardInput').value = "";

        const activeSet = type === 'menu' ? selectedMenuCards : selectedSpiceCards;
        const customs = type === 'menu' ? customMenuCards : customSpiceCards;

        // 기본 카드들 배치
        cardData[type].forEach(item => {
            createGridItem(grid, item.text, item.emoji, activeSet);
        });

        // 직접 작성된 카드 배치
        customs.forEach(text => {
            createGridItem(grid, text, "✍️", activeSet);
        });

        // 직접 입력 카드 트리거 배치
        const triggerNode = document.createElement('div');
        triggerNode.className = "select-item-card";
        triggerNode.style.background = "#fffdf0";
        triggerNode.style.borderColor = "#fcd670";
        triggerNode.innerHTML = `<span class="select-item-emoji">✍️</span><span class="select-item-text" style="color:#bfa000;">직접 입력</span>`;
        triggerNode.onclick = () => document.getElementById('customCardInput').focus();
        grid.appendChild(triggerNode);

        overlay.style.display = "block";
        setTimeout(() => sheet.classList.add('show'), 10);
    }

    function createGridItem(targetGrid, text, emoji, activeSet) {
        const node = document.createElement('div');
        node.className = `select-item-card ${activeSet.has(text) ? 'selected' : ''}`;
        node.innerHTML = `<span class="select-item-emoji">${emoji}</span><span class="select-item-text">${text}</span>`;
        
        node.onclick = () => {
            if(activeSet.has(text)) {
                activeSet.delete(text);
                node.classList.remove('selected');
            } else {
                activeSet.add(text);
                node.classList.add('selected');
            }
        };
        targetGrid.appendChild(node);
    }

    /* 직접 입력 등록 스크립트 */
    function addCustomKeywordCard() {
        const input = document.getElementById('customCardInput');
        const text = input.value.trim();
        if(!text) return;

        const activeSet = currentTargetSlotType === 'menu' ? selectedMenuCards : selectedSpiceCards;
        const customs = currentTargetSlotType === 'menu' ? customMenuCards : customSpiceCards;

        if(!customs.includes(text) && !cardData[currentTargetSlotType].some(c => c.text === text)){
            customs.push(text);
        }
        
        activeSet.add(text);
        input.value = "";
        
        const grid = document.getElementById('sheetGrid');
        grid.innerHTML = "";
        cardData[currentTargetSlotType].forEach(item => createGridItem(grid, item.text, item.emoji, activeSet));
        customs.forEach(t => createGridItem(grid, t, "✍️", activeSet));
        
        const triggerNode = document.createElement('div');
        triggerNode.className = "select-item-card";
        triggerNode.style.background = "#fffdf0";
        triggerNode.style.borderColor = "#fcd670";
        triggerNode.innerHTML = `<span class="select-item-emoji">✍️</span><span class="select-item-text" style="color:#bfa000;">직접 입력</span>`;
        triggerNode.onclick = () => document.getElementById('customCardInput').focus();
        grid.appendChild(triggerNode);
    }

    /* 바텀시트 닫힐 때 복원된 2분할 슬롯 상자 내부에 카드 조립 리프레시 */
    function closeBottomSheet() {
        document.getElementById('bottomSheet').classList.remove('show');
        setTimeout(() => document.getElementById('sheetOverlay').style.display = "none", 300);
        renderDeckChips();
    }

    /* 다중 선택 카드를 슬롯 박스 안에 컴팩트하게 배치하는 렌더러 */
    function renderDeckChips() {
        const menuSlot = document.getElementById('slot-menu');
        const spiceSlot = document.getElementById('slot-spice');

        // 1. 종류 슬롯 리프레시
        if (selectedMenuCards.size === 0) {
            menuSlot.innerHTML = `<div class="slot-icon">＋</div><div class="slot-label">어떤 종류?</div>`;
        } else {
            let innerHTML = `<div class="slot-chips-inner">`;
            selectedMenuCards.forEach(text => {
                const item = cardData.menu.find(c => c.text === text);
                const emoji = item ? item.emoji : "✍️";
                innerHTML += `<div class="equipped-chip" onclick="event.stopPropagation();"><span>${emoji} ${text}</span><span class="chip-remove" onclick="removeSingleCard('menu', '${text}')">×</span></div>`;
            });
            innerHTML += `</div>`;
            menuSlot.innerHTML = innerHTML;
        }

        // 2. 맛 특성 슬롯 리프레시
        if (selectedSpiceCards.size === 0) {
            spiceSlot.innerHTML = `<div class="slot-icon">＋</div><div class="slot-label">어떤 맛 특성?</div>`;
        } else {
            let innerHTML = `<div class="slot-chips-inner">`;
            selectedSpiceCards.forEach(text => {
                const item = cardData.spice.find(c => c.text === text);
                const emoji = item ? item.emoji : "✍️";
                innerHTML += `<div class="equipped-chip" onclick="event.stopPropagation();"><span>${emoji} ${text}</span><span class="chip-remove" onclick="removeSingleCard('spice', '${text}')">×</span></div>`;
            });
            innerHTML += `</div>`;
            spiceSlot.innerHTML = innerHTML;
        }
    }

    function removeSingleCard(type, text) {
        if(type === 'menu') selectedMenuCards.delete(text);
        else selectedSpiceCards.delete(text);
        renderDeckChips();
    }

    function changeRadiusValue(val) {
        document.querySelectorAll('.tick-item').forEach(item => item.classList.remove('active'));
        const targetTick = document.getElementById('tick-' + val);
        if (targetTick) targetTick.classList.add('active');
    }

    function toggleRandomMode() {
        const btn = document.getElementById('randomToggleBtn');
        isRandomMode = !isRandomMode;

        const menuSlot = document.getElementById('slot-menu');
        const spiceSlot = document.getElementById('slot-spice');

        if (isRandomMode) {
            btn.innerText = "ON";
            btn.classList.add('active');
            selectedMenuCards.clear();
            selectedSpiceCards.clear();
            renderDeckChips();
            menuSlot.style.opacity = "0.5";
            spiceSlot.style.opacity = "0.5";
        } else {
            btn.innerText = "OFF";
            btn.classList.remove('active');
            menuSlot.style.opacity = "1";
            spiceSlot.style.opacity = "1";
        }
    }

    function startCardCasting() {
        if (!userLat || !userLng) { alert("위치 안테나 연결이 필요해요!"); return; }
        
        if (isRandomMode) {
            if (rerollDaggers <= 0) { alert("💔 하트 토큰을 모두 다 썼어요! 내일 다시 시도해주세요."); return; }
            rerollDaggers--;
            document.getElementById('daggerCounter').innerText = `❤️ 하트 토큰 기회: ${rerollDaggers} / 3`;
        }

        const submitBtn = document.getElementById('submitBtn');
        const castingBox = document.getElementById('castingBox');
        const castingBarFill = document.getElementById('castingBarFill');
        const resultSection = document.getElementById('resultSection');

        resultSection.style.display = "none";
        submitBtn.style.display = "none";
        castingBox.style.display = "block";
        castingBarFill.style.width = "0%";

        setTimeout(() => castingBarFill.style.width = "100%", 50);

        setTimeout(() => {
            castingBox.style.display = "none";
            submitBtn.style.display = "block";
            fetchRestaurants();
        }, 1250);
    }

    function fetchRestaurants() {
        const radius = parseInt(document.getElementById('radiusRange').value);
        let queryParts = [];

        if (!isRandomMode) {
            selectedMenuCards.forEach(val => queryParts.push(val));
            selectedSpiceCards.forEach(val => queryParts.push(val));
        }

        let query = queryParts.length > 0 ? queryParts.join(" ") : "음식점";

        const searchOptions = {
            location: new kakao.maps.LatLng(userLat, userLng),
            radius: radius,
            category_group_code: 'FD6',
            sort: kakao.maps.services.SortBy.DISTANCE
        };

        ps.keywordSearch(query, (data, status) => {
            if (status === kakao.maps.services.Status.OK) {
                if (isRandomMode && data.length > 0) {
                    renderList([data[Math.floor(Math.random() * data.length)]]);
                } else {
                    renderList(data);
                }
            } else {
                renderList([]);
            }
        }, searchOptions);
    }

    function renderList(places) {
        const container = document.getElementById('restaurantContainer');
        const section = document.getElementById('resultSection');
        container.innerHTML = "";

        if (!places || places.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">해당 카드 조합들의 맛집 크루를 찾지 못했어요 🥲</div>`;
        } else {
            places.forEach((place, index) => {
                const card = document.createElement('div');
                card.className = "restaurant-card";
                card.style.animationDelay = `${index * 0.06}s`;
                
                card.innerHTML = `
                    <div class="restaurant-thumb">🍴</div>
                    <div class="restaurant-info">
                        <div>
                            <div class="restaurant-name">${place.place_name}</div>
                            <div class="restaurant-category">${place.category_name.split(' > ').pop()}</div>
                        </div>
                        <div class="restaurant-meta">
                            <span class="distance">📍 여기로부터 ${place.distance}m</span>
                            <button class="btn-map-trigger" onclick="selectPlaceForMap('${place.place_name}', '${place.x}', '${place.y}')">길 찾기 🧭</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        section.style.display = "block";
        section.scrollIntoView({ behavior: 'smooth' });
    }

    function selectPlaceForMap(name, x, y) {
        selectedPlace = { name, x, y };
        document.getElementById('modalTargetName').innerText = name;
        document.getElementById('mapModal').style.display = "flex";
    }
    function closeMapModal() { document.getElementById('mapModal').style.display = "none"; }

    function openMapApp(provider) {
        if (!selectedPlace) return;
        const { name, x, y } = selectedPlace;
        let url = provider === 'kakao' ? `https://map.kakao.com/link/to/${encodeURIComponent(name)},${y},${x}` : `https://map.naver.com/v5/search/${encodeURIComponent(name)}`;
        window.open(url, '_blank');
        closeMapModal();
    }
</script>
</body>
</html>
