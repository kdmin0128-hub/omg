<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오늘 뭐 먹지? | 복잡한 메뉴 고민, 이제는 끝!</title>
    
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=566c59003be0a7db1292fbbc43b0fad0&libraries=services&autoload=false"></script>
    
    <style>
        :root {
            --bg-sweet: #fbf9f6;
            --card-white: #ffffff;
            --text-main: #3a3a3a;
            --text-muted: #b0a69f;
            --primary-pink: #ff7888;
            --soft-yellow: #ffebcc;
            --mint: #66dbb2;
            --shadow-color: #ebdcd0;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        body { background-color: var(--bg-sweet); color: var(--text-main); padding-bottom: 50px; overflow-x: hidden; }
        
        .container { max-width: 500px; margin: 0 auto; padding: 10px 16px; }

        .omg-image-header {
            background-color: transparent;
            padding: 0 0 10px 0;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .omg-header-img {
            width: 50%;
            max-width: 220px;
            height: auto;
            display: block;
            background-color: transparent;
        }

        .cute-card { background: var(--card-white); border: 3px solid #f2ece6; border-radius: 26px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 0px var(--shadow-color); position: relative; }
        
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .section-title { font-size: 16px; font-weight: 900; color: #ff5266; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }

        .btn-gps { width: 100%; background: #e8fcf4; color: #1abc9c; border: 2px dashed #a3ecd4; padding: 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-gps:disabled { border: 3px solid #1abc9c; color: white; background: #1abc9c; cursor: default; box-shadow: 0 4px 0 #148f77; }
        
        .btn-retry { background: #f2ece6; border: none; padding: 6px 14px; border-radius: 12px; font-size: 12px; font-weight: bold; color: #666; cursor: pointer; box-shadow: 0 2px 0 #d5c8bd; }
        .btn-retry:active { transform: translateY(1px); box-shadow: 0 1px 0 #d5c8bd; }
        .privacy-note { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 10px; font-weight: bold; }
        
        .range-container { margin-top: 16px; width: 100%; }
        .range-slider { width: 100%; height: 10px; -webkit-appearance: none; background: #ebdcd0; border-radius: 5px; outline: none; }
        .range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #ff5266; cursor: pointer; border: 3px solid white; box-shadow: 0 3px 0px #cf3c4e; }
        
        .range-ticks { display: flex; justify-content: space-between; margin-top: 10px; padding: 0 5px; }
        .tick-item { display: flex; flex-direction: column; align-items: center; width: 65px; text-align: center; }
        .tick-label { font-size: 11px; color: var(--text-muted); font-weight: bold; }
        .tick-kcal { font-size: 10px; color: #b5aaa0; margin-top: 2px; font-weight: 500; display: block; white-space: nowrap; }
        
        .tick-item.active .tick-label { color: #ff5266; font-weight: 900; }
        .tick-item.active .tick-kcal { color: #e67e22; font-weight: bold; }

        .deck-slots-flex { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .slot-add-trigger { width: 100%; background: #faf8f5; border: 3px dashed #ebdcd0; border-radius: 22px; padding: 20px 10px; text-align: center; cursor: pointer; font-size: 15px; font-weight: bold; color: #ff7888; transition: all 0.2s; display: flex; align-items: center; justify-content: center; min-height: 70px; }
        .slot-add-trigger:active { transform: scale(0.98); }
        
        .selected-chips-board { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; background: #fffdfa; border: 2px solid #f2ece6; border-radius: 20px; padding: 14px; margin-top: 4px; }
        .equipped-chip { background: white; border: 2px solid #ff7888; color: #ff5266; font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 14px; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 0 #ffbcc4; animation: pop 0.2s ease-out; }
        .chip-remove { font-size: 14px; cursor: pointer; color: #b0a69f; font-weight: bold; }
        .chip-remove:hover { color: #ff5266; }

        .bottom-sheet-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; z-index: 2000; backdrop-filter: blur(2px); }
        .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: white; border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 24px 16px; max-height: 85vh; overflow-y: auto; z-index: 2001; transition: bottom 0.3s ease-out; box-shadow: 0 -8px 20px rgba(0,0,0,0.05); }
        .bottom-sheet.show { bottom: 0; }
        
        .step-indicator { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
        .step-dot { font-size: 11px; font-weight: bold; background: #eeded1; color: #b0a69f; padding: 4px 12px; border-radius: 10px; }
        .step-dot.active { background: #ff5266; color: white; }

        .sheet-title { font-size: 15px; font-weight: 900; text-align: center; margin-bottom: 16px; word-break: keep-all; }
        
        .card-selection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .select-item-card { background: #faf8f5; border: 2.5px solid #f0ede8; border-radius: 18px; padding: 12px 4px; text-align: center; cursor: pointer; box-shadow: 0 4px 0 #eeded1; position: relative; transition: all 0.1s; }
        .select-item-card.selected { background: #fff0f2; border-color: #ff5266; box-shadow: 0 4px 0 #ffbcc4; transform: translateY(-1px); }
        .select-item-card.selected::after { content: '✓'; position: absolute; top: 4px; right: 8px; color: #ff5266; font-weight: bold; font-size: 12px; }
        .select-item-emoji { font-size: 26px; margin-bottom: 4px; display: block; }
        .select-item-text { font-size: 12px; font-weight: bold; }

        .custom-input-box { background: #fffdf9; border: 2px dashed #ffcc99; border-radius: 16px; padding: 10px; margin-bottom: 16px; display: none; align-items: center; gap: 8px; }
        .custom-input-box input { flex: 1; border: 2px solid #f2ece6; padding: 8px 12px; border-radius: 12px; font-size: 13px; font-weight: bold; outline: none; }
        .custom-input-box button { background: #ffcc99; border: none; color: #d35400; font-weight: bold; padding: 8px 14px; border-radius: 12px; cursor: pointer; font-size: 12px; }

        .sheet-btn-group { display: flex; gap: 10px; width: 100%; }
        .btn-sheet-back { flex: 1; background: #f2ece6; color: #5a5a5a; border: none; padding: 14px 8px; border-radius: 16px; font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #d5c8bd; display: none; text-align: center; white-space: nowrap; }
        .btn-sheet-back:active { transform: translateY(2px); box-shadow: 0 2px 0 #d5c8bd; }
        .btn-sheet-confirm { flex: 1; background: #ff5266; color: white; border: none; padding: 14px 8px; border-radius: 16px; font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #cf3c4e; text-align: center; white-space: nowrap; }
        .btn-sheet-confirm:active { transform: translateY(2px); box-shadow: 0 2px 0 #cf3c4e; }

        .casting-box { display: none; text-align: center; padding: 20px 0; }
        .casting-text { font-size: 14px; font-weight: bold; color: #ff5266; margin-bottom: 10px; animation: bounce 0.5s infinite alternate; word-break: keep-all; line-height: 1.4; }
        .casting-bar-bg { width: 100%; height: 12px; background: #eeded1; border-radius: 6px; overflow: hidden; }
        .casting-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ffebcc, #ff7888); border-radius: 6px; transition: width 1.2s linear; }

        .btn-submit { width: 100%; background: linear-gradient(135deg, #ff5266, #ff7888); color: white; border: none; padding: 16px; border-radius: 22px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0px #d6384b; letter-spacing: -0.3px; margin-top: 10px; }
        .btn-submit:active { transform: translateY(4px); box-shadow: 0 2px 0px #d6384b; }

        .result-section { margin-top: 24px; display: none; }
        .sort-filter-bar { display: flex; justify-content: flex-end; align-items: center; background: transparent; padding: 4px 2px; margin-bottom: 14px; gap: 8px; }
        .btn-sort { background: white; border: 1.5px solid #eeded1; padding: 8px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; color: #666; cursor: pointer; display: flex; align-items: center; gap: 2px; transition: all 0.15s; box-shadow: 0 2px 0 #f2ece6; }
        .btn-sort.active { border-color: #ff5266; color: #ff5266; background: #fff0f2; box-shadow: 0 2px 0 #ffbcc4; }
        
        .restaurant-list { display: flex; flex-direction: column; gap: 14px; }
        
        /* 5번 요구사항 연동: 카드 전체 영역 선택 시 포인터 연출 처리 추가 */
        .restaurant-card { background: var(--card-white); border: 3px solid #f2ece6; border-radius: 22px; padding: 14px; display: flex; gap: 12px; position: relative; box-shadow: 0 6px 0 var(--shadow-color); opacity: 0; transform: translateY(20px); animation: slideUp 0.4s forwards; cursor: pointer; transition: transform 0.15s; }
        .restaurant-card:active { transform: translateY(2px); }
        .restaurant-card::before { content: 'MATCH'; position: absolute; top: 0; left: 0; background: #ffebcc; color: #d35400; font-size: 9px; font-weight: 900; padding: 3px 8px; border-bottom-right-radius: 12px; z-index: 5; }
        
        /* 3번 요구사항: 동적 웹 이미지 수용 가능한 익스텐션 레이아웃 처리 */
        .restaurant-thumb { width: 66px; height: 66px; border-radius: 16px; background: #fffdfa; border: 2px solid #eeded1; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; overflow: hidden; }
        .restaurant-thumb img { width: 100%; height: 100%; object-fit: cover; }
        
        .restaurant-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; padding-top: 4px; }
        .restaurant-name { font-size: 16px; font-weight: 900; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .restaurant-category { font-size: 11px; color: #ff7888; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
        .restaurant-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
        .distance { font-size: 12px; color: #ff5266; font-weight: 900; }
        .btn-map-trigger { background: #fff0f2; border: 1px solid #ffccd3; color: #ff5266; padding: 6px 14px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 3000; backdrop-filter: blur(2px); }
        .modal { background: var(--card-white); border: 3px solid #f2ece6; width: 100%; max-width: 340px; border-radius: 24px; padding: 22px; text-align: center; }
        .modal-title { font-size: 16px; font-weight: 900; margin-bottom: 20px; word-break: break-all; }
        .map-options { display: flex; flex-direction: column; gap: 10px; }
        .map-btn { width: 100%; padding: 14px; border: none; border-radius: 16px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        .map-btn.kakao { background: #fee500; color: #3c1e1e; box-shadow: 0 4px 0 #ebd100; }
        
        /* 6번 요구사항: 네이버지도 열기 문구 공백 제거 대응 */
        .map-btn.naver { background: #03c75a; color: white; box-shadow: 0 4px 0 #02a64a; }
        .modal-close { background: none; border: none; color: var(--text-muted); margin-top: 16px; cursor: pointer; text-decoration: underline; font-size: 12px; font-weight: bold; }

        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-5px); } }
        @keyframes pop { 0% { transform: scale(0.9); } 100% { transform: scale(1); } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="omg-image-header" onclick="window.location.reload();">
        <img src="omg.png" alt="오늘 뭐 먹지? OMG" class="omg-header-img">
    </div>

    <div class="cute-card">
        <div class="section-header">
            <div class="section-title">📍 탐색 반경</div>
            <button class="btn-retry" onclick="getGPSLocation()">재탐색</button>
        </div>
        <button class="btn-gps" id="gpsBtn" onclick="getGPSLocation()">현재 위치를 찾고 있어요</button>
        <div class="privacy-note">⚠️ 괜찮아요! 위치 정보를 수집하지 않아요.</div>
        
        <div class="range-container">
            <input type="range" class="range-slider" id="radiusRange" min="200" max="1000" step="200" value="400" oninput="changeRadiusValue(this.value)">
            <div class="range-ticks">
                <div class="tick-item" id="tick-200">
                    <span class="tick-label">200m</span>
                    <span class="tick-kcal">약 22kcal</span>
                </div>
                <div class="tick-item active" id="tick-400">
                    <span class="tick-label">400m</span>
                    <span class="tick-kcal">약 45kcal</span>
                </div>
                <div class="tick-item" id="tick-600">
                    <span class="tick-label">600m</span>
                    <span class="tick-kcal">약 67kcal</span>
                </div>
                <div class="tick-item" id="tick-800">
                    <span class="tick-label">800m</span>
                    <span class="tick-kcal">약 90kcal</span>
                </div>
                <div class="tick-item" id="tick-1000">
                    <span class="tick-label">1km</span>
                    <span class="tick-kcal">약 112kcal</span>
                </div>
            </div>
        </div>
    </div>

    <div class="cute-card" id="deckContainerCard">
        <div class="section-title">📝 나만의 먹켓리스트</div>

        <div class="deck-slots-flex" id="slotsWrapper">
            <div class="slot-add-trigger" id="masterAddBtn" onclick="startSequentialSelection()">
                ➕ 여기를 눌러 먹켓 채우기
            </div>
            <div class="selected-chips-board" id="chipsBoard"></div>
        </div>
    </div>

    <div class="casting-box" id="castingBox">
        <div class="casting-text" id="castingText">조금만 기다려 주세요.<br>내가 만든 나만의 맛집을 찾고 있어요.</div>
        <div class="casting-bar-bg"><div class="casting-bar-fill" id="castingBarFill"></div></div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="startCardCasting()">AI 추천 식당 검색✨</button>

    <div class="result-section" id="resultSection">
        <div class="sort-filter-bar">
            <button class="btn-sort" id="sortDistanceBtn" onclick="handleDistanceClick()">거리순</button>
            <button class="btn-sort" id="sortMatchBtn" onclick="handleMatchClick()">매칭순</button>
        </div>
        <div class="restaurant-list" id="restaurantContainer"></div>
    </div>
</div>

<div class="bottom-sheet-overlay" id="sheetOverlay" onclick="forceCloseBottomSheet()"></div>
<div class="bottom-sheet" id="bottomSheet">
    <div class="step-indicator">
        <div class="step-dot" id="stepDot-menu">Step 1. 종류</div>
        <div class="step-dot" id="stepDot-spice">Step 2. 취향</div>
    </div>
    
    <div class="sheet-title" id="sheetTitle">카드를 골라주세요</div>
    
    <div class="custom-input-box" id="customInputWrapper">
        <input type="text" id="customCardInput" placeholder="원하는 키워드 직접 입력...">
        <button onclick="addCustomKeywordCard()">추가</button>
    </div>

    <div class="card-selection-grid" id="sheetGrid"></div>
    
    <div class="sheet-btn-group">
        <button class="btn-sheet-back" id="sheetBackBtn" onclick="renderBottomSheetStep('menu')">⬅️ 이전 단계로 (종류 선택)</button>
        <button class="btn-sheet-confirm" id="sheetConfirmBtn" onclick="handleSheetConfirm()">다음 단계로 ➡️</button>
    </div>
</div>

<div class="modal-overlay" id="mapModal">
    <div class="modal">
        <div class="modal-title" id="modalTargetName">식당 이름</div>
        <div class="map-options">
            <button class="map-btn kakao" onclick="openMapApp('kakao')">💛 카카오맵 열기</button>
            <button class="map-btn naver" onclick="openMapApp('naver')">💚 네이버지도 열기</button>
        </div>
        <button class="modal-close" onclick="closeMapModal()">닫을래요</button>
    </div>
</div>

<script>
    let userLat = null;
    let userLng = null;
    let selectedPlace = null;
    let ps = null;
    let geocoder = null;
    let gpsInterval = null;

    let selectedMenuCards = new Set();
    let selectedSpiceCards = new Set();
    let currentTargetSlotType = 'menu';

    let customMenuCards = [];
    let customSpiceCards = [];

    let currentFetchedPlaces = [];
    let isDistanceFilterOn = false;
    let isMatchFilterOn = false;

    const cardData = {
        menu: [
            { text: "한식", emoji: "🍲" }, { text: "중식", emoji: "🥟" }, { text: "일식", emoji: "🍣" }, { text: "양식", emoji: "🍝" },
            { text: "아시안", emoji: "🌴" }, { text: "분식", emoji: "🍛" }, { text: "샐러드/다이어트", emoji: "🥗" }, 
            { text: "패스트푸드", emoji: "🍔" }, { text: "카페/디저트", emoji: "☕" }
        ],
        spice: [
            { text: "매콤한", emoji: "🌶️" }, { text: "단짠단짠", emoji: "🥨" }, { text: "기름진/고소한", emoji: "🍗" }, { text: "가벼운/깔끔한", emoji: "🍃" },
            { text: "육류 중심", emoji: "🥩" }, { text: "해산물 중심", emoji: "🍤" }, { text: "닭/오리", emoji: "🐔" },
            { text: "밥", emoji: "🍚" }, { text: "면", emoji: "🍜" }, { text: "빵/샌드위치", emoji: "🍞" },
            { text: "해장/국물", emoji: "🍲" }
        ]
    };

    window.onload = function() {
        if (typeof kakao !== 'undefined' && kakao.maps) {
            kakao.maps.load(() => {
                ps = new kakao.maps.services.Places();
                geocoder = new kakao.maps.services.Geocoder();
                getGPSLocation();
            });
        }
    }

    function startGpsAnimation() {
        const gpsBtn = document.getElementById('gpsBtn');
        let dotCount = 0;
        clearInterval(gpsInterval);
        gpsInterval = setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            gpsBtn.innerText = "현재 위치를 찾고 있어요" + ".".repeat(dotCount);
        }, 400);
    }

    function getGPSLocation() {
        const gpsBtn = document.getElementById('gpsBtn');
        gpsBtn.disabled = false;
        startGpsAnimation();
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                position => {
                    clearInterval(gpsInterval);
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    
                    if (geocoder) {
                        geocoder.coord2RegionCode(userLng, userLat, (result, status) => {
                            if (status === kakao.maps.services.Status.OK) {
                                let address = "알 수 없는 위치";
                                for(let i = 0; i < result.length; i++) {
                                    if(result[i].region_type === 'H') {
                                        address = result[i].address_name;
                                        break;
                                    }
                                }
                                gpsBtn.innerText = `현재 위치 : ${address}`;
                            } else {
                                gpsBtn.innerText = `현재 위치 : 위도 ${userLat.toFixed(4)}, 경도 ${userLng.toFixed(4)}`;
                            }
                            gpsBtn.disabled = true;
                        });
                    } else {
                        gpsBtn.innerText = "현재 위치 수신 성공! (라이브러리 매칭 중)";
                        gpsBtn.disabled = true;
                    }
                },
                error => { 
                    clearInterval(gpsInterval);
                    gpsBtn.innerText = "현재 위치를 찾을 수 없어요."; 
                    gpsBtn.disabled = false;
                }
            );
        } else {
            clearInterval(gpsInterval);
            gpsBtn.innerText = "위치 정보가 지원되지 않는 브라우저입니다.";
        }
    }

    function startSequentialSelection() {
        renderBottomSheetStep('menu');
    }

    function renderBottomSheetStep(type) {
        currentTargetSlotType = type;
        const sheet = document.getElementById('bottomSheet');
        const overlay = document.getElementById('sheetOverlay');
        const grid = document.getElementById('sheetGrid');
        const title = document.getElementById('sheetTitle');
        const inputWrapper = document.getElementById('customInputWrapper');
        const backBtn = document.getElementById('sheetBackBtn');
        const confirmBtn = document.getElementById('sheetConfirmBtn');

        document.getElementById('stepDot-menu').classList.remove('active');
        document.getElementById('stepDot-spice').classList.remove('active');
        document.getElementById('stepDot-' + type).classList.add('active');

        if(type === 'menu') {
            title.innerText = "🥦 Step 1. 어떤 종류의 음식을 먹고 싶나요? (복수 선택 가능)";
            backBtn.style.display = "none";
            confirmBtn.innerText = "다음 단계로 (취향 선택) ➡️";
        } else {
            title.innerText = "🔥 Step 2. 세부적인 맛과 취향을 골라주세요. (복수 선택 가능)";
            backBtn.style.display = "block";
            confirmBtn.innerText = "선택 완료";
        }

        grid.innerHTML = "";
        inputWrapper.style.display = "flex";
        document.getElementById('customCardInput').value = "";

        const activeSet = type === 'menu' ? selectedMenuCards : selectedSpiceCards;
        const customs = type === 'menu' ? customMenuCards : customSpiceCards;

        cardData[type].forEach(item => {
            createGridItem(grid, item.text, item.emoji, activeSet);
        });

        customs.forEach(text => {
            createGridItem(grid, text, "✍️", activeSet);
        });

        const triggerNode = document.createElement('div');
        triggerNode.className = "select-item-card";
        triggerNode.style.background = "#fffdf0";
        triggerNode.style.borderColor = "#fcd670";
        triggerNode.innerHTML = `<span class="select-item-emoji">✍️</span><span class="select-item-text" style="color:#bfa000;">직접 입력</span>`;
        triggerNode.onclick = () => document.getElementById('customCardInput').focus();
        grid.appendChild(triggerNode);

        overlay.style.display = "block";
        if(!sheet.classList.contains('show')) {
            setTimeout(() => sheet.classList.add('show'), 10);
        }
    }

    function createGridItem(targetGrid, text, emoji, activeSet) {
        const node = document.createElement('div');
        node.className = `select-item-card ${activeSet.has(text) ? 'selected' : ''}`;
        node.innerHTML = `<span class="select-item-emoji">${emoji}</span><span class="select-item-text">${text}</span>`;
        
        node.onclick = () => {
            if(activeSet.has(text)) {
                activeSet.delete(text);
                node.classList.remove('selected');
            } else {
                activeSet.add(text);
                node.classList.add('selected');
            }
        };
        targetGrid.appendChild(node);
    }

    function addCustomKeywordCard() {
        const input = document.getElementById('customCardInput');
        const text = input.value.trim();
        if(!text) return;

        const activeSet = currentTargetSlotType === 'menu' ? selectedMenuCards : selectedSpiceCards;
        const customs = currentTargetSlotType === 'menu' ? customMenuCards : customSpiceCards;

        if(!customs.includes(text) && !cardData[currentTargetSlotType].some(c => c.text === text)){
            customs.push(text);
        }
        
        activeSet.add(text);
        input.value = "";
        renderBottomSheetStep(currentTargetSlotType);
    }

    function handleSheetConfirm() {
        if (currentTargetSlotType === 'menu') {
            renderBottomSheetStep('spice');
        } else {
            closeBottomSheet();
        }
    }

    function closeBottomSheet() {
        document.getElementById('bottomSheet').classList.remove('show');
        setTimeout(() => document.getElementById('sheetOverlay').style.display = "none", 300);
        renderCombinedChips();
    }

    function forceCloseBottomSheet() {
        closeBottomSheet();
    }

    function renderCombinedChips() {
        const chipsBoard = document.getElementById('chipsBoard');
        const masterAddBtn = document.getElementById('masterAddBtn');

        if (selectedMenuCards.size === 0 && selectedSpiceCards.size === 0) {
            chipsBoard.innerHTML = "";
            chipsBoard.style.display = "none";
            masterAddBtn.innerText = "➕ 여기를 눌러 먹켓 채우기";
        } else {
            masterAddBtn.innerText = "🔄 구성 다시 변경하기";
            let innerHTML = "";

            selectedMenuCards.forEach(text => {
                const item = cardData.menu.find(c => c.text === text);
                const emoji = item ? item.emoji : "✍️";
                innerHTML += `<div class="equipped-chip"><span>${emoji} ${text}</span><span class="chip-remove" onclick="removeSingleCard('menu', '${text}')">×</span></div>`;
            });

            selectedSpiceCards.forEach(text => {
                const item = cardData.spice.find(c => c.text === text);
                const emoji = item ? item.emoji : "✍️";
                innerHTML += `<div class="equipped-chip" style="border-color:#66dbb2; color:#1abc9c; box-shadow:0 2px 0 #b3f0db;"><span>${emoji} ${text}</span><span class="chip-remove" onclick="removeSingleCard('spice', '${text}')">×</span></div>`;
            });

            chipsBoard.innerHTML = innerHTML;
            chipsBoard.style.display = "flex";
        }
    }

    function removeSingleCard(type, text) {
        if(type === 'menu') selectedMenuCards.delete(text);
        else selectedSpiceCards.delete(text);
        renderCombinedChips();
    }

    function changeRadiusValue(val) {
        document.querySelectorAll('.tick-item').forEach(item => item.classList.remove('active'));
        const targetTick = document.getElementById('tick-' + val);
        if (targetTick) targetTick.classList.add('active');
    }

    function startCardCasting() {
        if (!userLat || !userLng) { alert("위치 안내 수신이 완료되지 않았어요!"); return; }

        const submitBtn = document.getElementById('submitBtn');
        const castingBox = document.getElementById('castingBox');
        const castingBarFill = document.getElementById('castingBarFill');
        const resultSection = document.getElementById('resultSection');

        resultSection.style.display = "none";
        submitBtn.style.display = "none";
        castingBox.style.display = "block";
        castingBarFill.style.width = "0%";

        setTimeout(() => castingBarFill.style.width = "100%", 50);

        setTimeout(() => {
            castingBox.style.display = "none";
            submitBtn.style.display = "block";
            fetchRestaurants();
        }, 1250);
    }

    // 업종 분류 기준 매칭 헬퍼 이모지 함수
    function getFallbackEmoji(category) {
        if(category.includes("한식")) return "🍲";
        if(category.includes("중식")) return "🥟";
        if(category.includes("일식")) return "🍣";
        if(category.includes("양식")) return "🍝";
        if(category.includes("분식")) return "🍛";
        if(category.includes("샐러드") || category.includes("뷔페")) return "🥗";
        if(category.includes("패스트푸드") || category.includes("치킨") || category.includes("피자")) return "🍔";
        if(category.includes("카페") || category.includes("제과") || category.includes("디저트")) return "☕";
        return "🍴";
    }

    function fetchRestaurants() {
        const radius = parseInt(document.getElementById('radiusRange').value);
        let queryParts = [];

        selectedMenuCards.forEach(val => queryParts.push(val));

        if (queryParts.length === 0) {
            const validKeywords = ["육류 중심", "해산물 중심", "닭/오리", "밥", "면", "빵/샌드위치", "해장/국물"];
            selectedSpiceCards.forEach(val => {
                if (validKeywords.includes(val)) {
                    let cleanWord = val.replace(" 중심", "");
                    queryParts.push(cleanWord);
                }
            });
        }

        let query = queryParts.length > 0 ? queryParts.join(" ") : "음식점";

        const searchOptions = {
            location: new kakao.maps.LatLng(userLat, userLng),
            radius: radius,
            category_group_code: 'FD6',
            sort: kakao.maps.services.SortBy.DISTANCE
        };

        ps.keywordSearch(query, (data, status) => {
            if (status === kakao.maps.services.Status.OK) {
                let filteredPlaces = data;

                if (selectedSpiceCards.has("해장/국물")) {
                    filteredPlaces = filteredPlaces.filter(place => 
                        place.category_name.includes("탕") || 
                        place.category_name.includes("찌개") || 
                        place.category_name.includes("국수") || 
                        place.category_name.includes("국밥") ||
                        place.category_name.includes("해장")
                    );
                }

                currentFetchedPlaces = filteredPlaces.map(place => {
                    let score = 0;
                    let matchedKeywords = [];

                    // 4번 요구사항 연동: 어떤 매칭 카드가 적중했는지 문자열 추적 기록 기법 도입
                    selectedMenuCards.forEach(card => { 
                        if(place.category_name.includes(card) || place.place_name.includes(card)) {
                            score++; 
                            if(!matchedKeywords.includes(card)) matchedKeywords.push(card);
                        } 
                    });
                    selectedSpiceCards.forEach(card => {
                        let clean = card.replace(" 중심", "");
                        if(place.category_name.includes(clean) || place.place_name.includes(clean)) {
                            score++;
                            if(!matchedKeywords.includes(card)) matchedKeywords.push(card);
                        }
                    });
                    
                    return { ...place, matchScore: score, matchedKeywords: matchedKeywords };
                });

                isDistanceFilterOn = false;
                isMatchFilterOn = false;
                updateSortButtonsUI();
                applyMultiSortAndRender();
            } else {
                currentFetchedPlaces = [];
                renderList([]);
            }
        }, searchOptions);
    }

    function handleDistanceClick() {
        isDistanceFilterOn = !isDistanceFilterOn;
        updateSortButtonsUI();
        applyMultiSortAndRender();
    }

    function handleMatchClick() {
        isMatchFilterOn = !isMatchFilterOn;
        updateSortButtonsUI();
        applyMultiSortAndRender();
    }

    function updateSortButtonsUI() {
        const dBtn = document.getElementById('sortDistanceBtn');
        const mBtn = document.getElementById('sortMatchBtn');

        if(isDistanceFilterOn) dBtn.classList.add('active');
        else dBtn.classList.remove('active');

        if(isMatchFilterOn) mBtn.classList.add('active');
        else mBtn.classList.remove('active');
    }

    function applyMultiSortAndRender() {
        let sorted = [...currentFetchedPlaces];

        if (isMatchFilterOn) {
            sorted.sort((a, b) => {
                if (b.matchScore !== a.matchScore) return b.matchScore - a.matchScore;
                return parseInt(a.distance) - parseInt(b.distance);
            });
        } else {
            sorted.sort((a, b) => parseInt(a.distance) - parseInt(b.distance));
        }

        renderList(sorted);
    }

    function renderList(places) {
        const container = document.getElementById('restaurantContainer');
        const section = document.getElementById('resultSection');
        container.innerHTML = "";

        if (!places || places.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:13px;">해당 카드 조합들의 맛집 크루를 찾지 못했어요 🥲</div>`;
        } else {
            places.forEach((place, index) => {
                const card = document.createElement('div');
                card.className = "restaurant-card";
                card.style.animationDelay = `${index * 0.04}s`;
                
                // 5번 요구사항: 카드 자체 영역 터치/클릭 연계 인터랙션 부착
                card.onclick = (e) => {
                    // 내부 길 찾기 단독 버튼 누를 때 버블링 중복 실행 방지
                    if(e.target.tagName === 'BUTTON') return;
                    selectPlaceForMap(place.place_name, place.x, place.y, place.place_url, place.id);
                };

                // 3번 요구사항: 썸네일 수집 처리 스키마 구현
                let thumbContent = "";
                if (place.main_photo_url) {
                    thumbContent = `<img src="${place.main_photo_url}" alt="thumb">`;
                } else if(place.image_url) {
                    thumbContent = `<img src="${place.image_url}" alt="thumb">`;
                } else {
                    thumbContent = getFallbackEmoji(place.category_name);
                }

                // 4번 요구사항: 텍스트 노출 가공 및 매칭 메뉴 연동 규격화
                let rawCategory = place.category_name ? place.category_name.split(' > ').pop() : "";
                let matchedTagStr = place.matchedKeywords && place.matchedKeywords.length > 0 ? place.matchedKeywords.join(', ') : "";
                
                let displayCategory = "";
                if(rawCategory && matchedTagStr) {
                    displayCategory = `${rawCategory} • 매칭: ${matchedTagStr}`;
                } else {
                    displayCategory = rawCategory || matchedTagStr || "음식점";
                }

                card.innerHTML = `
                    <div class="restaurant-thumb">${thumbContent}</div>
                    <div class="restaurant-info">
                        <div>
                            <div class="restaurant-name">${place.place_name}</div>
                            <div class="restaurant-category">${displayCategory}</div>
                        </div>
                        <div class="restaurant-meta">
                            <span class="distance">📍 여기로부터 ${place.distance}m</span>
                            <button class="btn-map-trigger" onclick="selectPlaceForMap('${place.place_name}', '${place.x}', '${place.y}', '${place.place_url}', '${place.id}')">길 찾기 🧭</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        section.style.display = "block";
    }

    // 5번 요구사항: 상세 페이지 변수 주입 구조 확장 업데이트
    function selectPlaceForMap(name, x, y, placeUrl, id) {
        selectedPlace = { name, x, y, placeUrl, id };
        document.getElementById('modalTargetName').innerText = name;
        document.getElementById('mapModal').style.display = "flex";
    }
    function closeMapModal() { document.getElementById('mapModal').style.display = "none"; }

    // 5, 6번 요구사항: 도보 전용 엔진 매개변수 적용 및 상세페이지 딥링크 커스텀 라우팅 함수
    function openMapApp(provider) {
        if (!selectedPlace) return;
        const { name, x, y, placeUrl, id } = selectedPlace;
        let url = "";

        if (provider === 'kakao') {
            // 카카오 상세 페이지 링크를 기반으로 도보 길찾기 인터랙션 유도
            if(id) {
                url = `https://map.kakao.com/link/to/${id}`;
            } else if(userLat && userLng) {
                url = `https://map.kakao.com/link/to/${encodeURIComponent(name)},${y},${x}?sName=${encodeURIComponent('현재 위치')}`;
            } else {
                url = placeUrl || `https://map.kakao.com/link/search/${encodeURIComponent(name)}`;
            }
        } else {
            // 네이버 지도 앱/웹 규격 전용 도보(mode=w) 딥링크 스펙 도입 
            if(userLat && userLng) {
                url = `https://map.naver.com/v5/directions/${userLng},${userLat},${encodeURIComponent('내위치')}/${x},${y},${encodeURIComponent(name)}/-/walk?c=15,0,0,0,dh`;
            } else {
                url = `https://map.naver.com/v5/search/${encodeURIComponent(name)}`;
            }
        }
        
        window.open(url, '_blank');
        closeMapModal();
    }
</script>
